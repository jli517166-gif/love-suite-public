name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check generated client and formatting
        run: |
          npm run check:client
          npm run format:check

      - name: Run plugin self-checks
        run: node plugin/patches/verify-all.mjs

      - name: Check publish contents
        run: npm pack --dry-run

      - name: Check package manifest
        run: node -e "const p=require('./package.json'); if(!p.exports||!p.exports['.']||!p.dsh) throw new Error('bad package manifest'); console.log('package ok:', p.name, p.version)"

      - name: Check GitHub install shape
        run: node -e "const fs=require('fs'); const need=['plugin/index.js','plugin/client.js','plugin/cordis.patch.yml','plugin/star/index.html']; for (const f of need) if (!fs.existsSync(f)) throw new Error('missing '+f); console.log('layout ok')"
