<title>记忆星海 · Memory Universe</title>
<style>

  :root {
    color-scheme: dark;
    --bg: #090d18; --surface: #101420; --raised: #171c2b;
    --ink: #e9edf7; --dim: #9aa6bd; --muted: #737f98;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; }
  button, input, select { font: inherit; }
  button { cursor: pointer; color: inherit; touch-action: manipulation; }
  button, select { -webkit-tap-highlight-color: transparent; }
  button { border: 0; background: none; }
  button:disabled { cursor: wait; opacity: .6; }
  button, a, input, select { outline-offset: 4px; }
  :focus-visible { outline: 2px solid var(--accent); }
  button:hover { color: white; }
  a { color: var(--accent); }
  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .svg-defs, [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip { position: fixed; top: -60px; left: 20px; z-index: 60; padding: 10px 16px; background: var(--raised); }
  .skip:focus { top: 10px; }
  .topbar { height: 78px; display: flex; align-items: center; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 26px 0 24px; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 12px; width: calc(var(--side) - 24px); flex-shrink: 0; }
  .brand-mark { width: 32px; height: 36px; color: #c3b5ff; }
  .brand strong { display: block; font-size: 18px; font-weight: 600; letter-spacing: .09em; line-height: 1.5; }
  .brand small { display: block; color: #8894ac; font-size: 10px; letter-spacing: .09em; }
  .breadcrumb { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .breadcrumb b { color: var(--ink); font-weight: 500; }

  .search { margin-left: auto; display: flex; align-items: center; gap: 10px; width: min(330px, 28vw); min-width: 170px; padding: 9px 12px; border: 1px solid #ffffff12; border-radius: 8px; background: #0b0f1b; color: var(--muted); }
  .search:focus-within { border-color: #b5a2ff88; box-shadow: 0 0 0 3px #b5a2ff0c; }
  .search input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); outline: 0; font-size: 12px; }
  .search input::placeholder { color: #7f8aa1; }

  .refresh { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 7px; background: #b5a2ff; color: #211b36; font-size: 12px; font-weight: 600; white-space: nowrap; }

  .nav-current .icon { width: 17px; }

  .inspector { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
  .inspector-heading { height: 68px; padding: 24px 23px 0; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }

  .orbit { width: 96px; height: 96px; color: var(--accent); opacity: .8; }

  .index-heading h3 { font-size: 11px; font-weight: 500; margin: 0; }

  .index-list { overflow: auto; scrollbar-width: thin; scrollbar-color: #333b50 transparent; min-height: 0; }
  .node-row { display: flex; text-align: left; width: 100%; gap: 10px; align-items: flex-start; padding: 11px 1px; border-bottom: 1px solid #ffffff07; content-visibility: auto; contain-intrinsic-size: auto 66px; }
  .node-row:hover { background: #b5a2ff08; }

  .inspector.has-selection .overview { display: none; }
  .panel.show { display: block; }

  .tag { display: inline-flex; gap: 6px; align-items: center; color: #c6b9ff; background: #b5a2ff10; border: 1px solid #b5a2ff16; font-size: 10px; padding: 3px 9px; border-radius: 5px; margin: 5px 0 17px; }

  .detail-facts span { font-size: 10px; color: var(--muted); }

  .panel .body { color: #bac5da; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.95; }
  .panel .meta { margin-top: 15px; color: #8895ad; font-size: 10px; overflow-wrap: anywhere; }
  .kw { display: flex; gap: 6px; flex-wrap: wrap; }
  .kw span { color: #a8b4cc; background: #ffffff04; border: 1px solid #ffffff0c; border-radius: 4px; padding: 3px 7px; font-size: 10px; overflow-wrap: anywhere; max-width: 100%; }
  .related .node-row { padding: 11px 0; }

  .detail-back:hover { background: #b5a2ff0b; }

  .memory-list .node-row { padding: 17px 14px; background: #111725dd; margin-bottom: 7px; border: 1px solid #ffffff09; border-radius: 7px; }
  .memory-list .node-row:hover { background: #1e2438; border-color: #b5a2ff38; }
  .memory-list .node-row strong { font-size: 13px; }
  .memory-list .node-row small { font-size: 11px; }
  .node-excerpt { color: #97a4bf; font-size: 11px; line-height: 1.8; margin-top: 9px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

  .mobile-menu, .sidebar-dismiss { display: none; }

  @media (max-width: 1180px) { :root { --side: 188px; --inspect: 270px; } .breadcrumb { display: none; } .search { width: min(380px, 43vw); } .topbar { gap: 17px; } .stage-top { padding: 24px 20px 0; flex-wrap: wrap; } .graph-note { top: 138px; left: 20px; } .stage-footer { left: 20px; right: 20px; } .tiers { gap: 8px; } .tiers b { display: none; } .memory-list { top: 170px; } }

  /* Compact observatory: the graph is the interface; tools appear on demand. */
  :root { --top: 64px; --drawer: 318px; --inspect: 360px; }
  .topbar { height: var(--top); padding: 0 18px 0 20px; gap: 12px; background: rgba(13, 18, 31, .96); }
  .brand { width: auto; margin-right: 18px; order: 1; }
  .brand-mark { width: 25px; height: 29px; }
  .brand strong { font-size: 15px; letter-spacing: .06em; }
  .brand small, .breadcrumb { display: none; }
  .search { order: 2; margin: 0 auto; width: min(520px, 48vw); background: #090d17; }
  .refresh { order: 3; padding: 8px 12px; background: transparent; color: #aeb8cc; border: 1px solid #ffffff12; }
  .refresh:hover { color: #e8e3ff; background: #ffffff08; }
  .mobile-menu { order: 4; display: flex; align-items: center; gap: 7px; padding: 8px 12px; border: 1px solid #b5a2ff30; border-radius: 7px; background: #b5a2ff12; color: #c9bcff; font-size: 11px; }
  .mobile-menu:hover, .mobile-menu[aria-expanded="true"] { background: #b5a2ff20; color: #e2dcff; }
  .workspace { height: calc(100dvh - var(--top)); display: block; }
  body::after { content: ''; position: fixed; inset: var(--top) 0 0; z-index: 34; background: #03050b8f; opacity: 0; pointer-events: none; transition: opacity 160ms ease-out; }
  body.sidebar-open::after { opacity: 1; pointer-events: auto; }
  .sidebar { position: fixed; z-index: 40; right: 14px; left: auto; top: calc(var(--top) + 10px); bottom: auto; width: min(var(--drawer), calc(100vw - 28px)); max-height: calc(100dvh - var(--top) - 24px); padding: 18px; border: 1px solid #ffffff14; border-radius: 12px; background: rgba(18, 23, 38, .98); box-shadow: 0 24px 80px #0008; transform: translateY(-8px) scale(.98); transform-origin: top right; opacity: 0; visibility: hidden; transition: transform 160ms ease-out, opacity 140ms ease-out, visibility 0s linear 160ms; }
  body.sidebar-open .sidebar { transform: translateY(0) scale(1); opacity: 1; visibility: visible; transition-delay: 0s; }
  .sidebar-dismiss { display: grid; place-items: center; position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; padding: 0; border-radius: 6px; color: #919cb2; }
  .sidebar-dismiss:hover { background: #ffffff08; }
  .function-title { margin: 0 38px 18px 0; font-size: 13px; font-weight: 500; }
  .function-section { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px; }

<script type="module">
function webglSupported() {
  try {
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!context) return false;
    context.getExtension('WEBGL_lose_context')?.loseContext();
    return true;
  } catch { return false; }
}

function showWebGLFallback(error) {
  const loading = document.getElementById('loading');
  loading.classList.remove('hide');
  loading.replaceChildren();
  const message = document.createElement('span');
  message.textContent = '无法启动三维星图。请开启浏览器硬件加速，或更新浏览器后重试。';
  const detail = document.createElement('small');
  detail.textContent = String(error?.message || 'WebGL 不可用');
  const retry = document.createElement('button');
  retry.className = 'refresh'; retry.textContent = '重新加载星图';
  retry.addEventListener('click', () => location.reload());
  loading.append(message, detail, retry);
  loading.style.flexDirection = 'column';
  loading.style.gap = '14px';
}

function startStarMap() {
  if (!webglSupported()) throw new Error('当前浏览器不支持 WebGL');

// Hover transitions follow org-roam-ui's 360ms eased neighbourhood highlight.
// This module uses the existing graph objects so layout and particles keep running.
function createGraphEffects(getData) {
  let hoveredId = null;
  let relatedIds = new Set();
  let hoveredLinks = new Set();
  let previousTime = 0;
  const nodeLevels = new WeakMap();
  const endpointId = (endpoint) => typeof endpoint === 'object' ? endpoint?.id : endpoint;

  function setHover(node) {
    hoveredId = node?.id ?? null;
    relatedIds = new Set(hoveredId === null ? [] : [hoveredId]);
    hoveredLinks = new Set();
    if (hoveredId === null) return;
    for (const link of getData().links) {
      if (link.visible === false) continue;
      const source = endpointId(link.source), target = endpointId(link.target);
      if (source !== hoveredId && target !== hoveredId) continue;
      relatedIds.add(source); relatedIds.add(target); hoveredLinks.add(link);
    }
  }

  function update(time, enabled = true) {
    const dt = Math.min(50, previousTime ? time - previousTime : 16);
    previousTime = time;
    if (!enabled) return;
    const blend = 1 - Math.exp(-dt / 90);
    const data = getData();
    for (const node of data.nodes) {
      const object = node.__threeObj;
      if (!object) continue;
      const target = relatedIds.has(node.id) ? 1 : 0;
      const previous = nodeLevels.get(object) || 0;
      const level = previous + (target - previous) * blend;
      object.scale.setScalar((node.__breathScale || 1) * (1 + level * (node.id === hoveredId ? 0.18 : 0.08)));
      nodeLevels.set(object, level);
    }
    for (const link of data.links) {
      const target = hoveredId === null ? 0 : hoveredLinks.has(link) ? 0.45 : -0.55;
      const previous = link.__hoverLevel || 0;
      link.__hoverLevel = previous + (target - previous) * blend;
    }
  }

  return { setHover, update };
}

function buildGalaxyLayer() {
  const c = document.createElement('canvas');
  c.width = Math.floor(W * 0.9);
  c.height = Math.floor(H * 0.9);
  const g = c.getContext('2d');
  const cx = c.width * 0.5, cy = c.height * 0.46;
  const scale = Math.min(c.width, c.height) * 0.42;
  g.globalCompositeOperation = 'screen';
  for (let index = 0; index < 4200; index += 1) {
    const arm = index % 2;
    const spread = Math.pow(Math.random(), 0.72);
    const radius = 16 + spread * scale;
    const theta = arm * Math.PI + Math.log(Math.max(1, radius) / 18) * 2.35 + (Math.random() - 0.5) * 0.16;
    const x = cx + Math.cos(theta) * radius;
    const y = cy + Math.sin(theta) * radius * 0.44;
    const warm = radius < scale * 0.2;
    const hii = !warm && index % 41 === 0;
    g.fillStyle = warm
      ? 'rgba(255,225,185,' + (0.10 + Math.random() * 0.25) + ')'
      : hii
        ? 'rgba(255,150,190,' + (0.18 + Math.random() * 0.25) + ')'
        : 'rgba(150,190,255,' + (0.05 + Math.random() * 0.16) + ')';
    g.beginPath();
    g.arc(x, y, hii ? 1.2 + Math.random() * 1.4 : 0.35 + Math.random() * 1.1, 0, Math.PI * 2);
    g.fill();
  }
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.55);
  halo.addColorStop(0, 'rgba(255,235,200,0.18)');
  halo.addColorStop(0.35, 'rgba(220,190,255,0.08)');
  halo.addColorStop(1, 'rgba(100,120,220,0)');
  g.fillStyle = halo;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

function buildClouds() {
  const c = document.createElement('canvas');
  c.width = Math.floor(W * 0.7);
  c.height = Math.floor(H * 0.7);
  const g = c.getContext('2d');
  g.scale(0.7, 0.7);
  for (let i = 0; i < 12; i++) {
    const cx = Math.random() * W;
    const cy = H * (0.18 + Math.random() * 0.62);
    const warm = i % 3 === 0;
    const rx = 120 + Math.random() * 420;
    const ry = rx * (0.18 + Math.random() * 0.32);
    const rg = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
    if (warm) {
      rg.addColorStop(0, 'rgba(205,120,150,0.07)');
      rg.addColorStop(0.45, 'rgba(160,90,140,0.035)');
      rg.addColorStop(1, 'rgba(90,40,90,0)');
    } else {
      rg.addColorStop(0, 'rgba(110,150,235,0.075)');
      rg.addColorStop(0.45, 'rgba(80,120,210,0.035)');
      rg.addColorStop(1, 'rgba(30,60,130,0)');
    }
    g.save();
    g.translate(cx, cy);
    g.scale(1, ry / rx);
    g.beginPath();
    g.arc(0, 0, rx, 0, Math.PI * 2);
    g.fillStyle = rg;
    g.fill();
    g.restore();
  }
  clouds = c;
}

function drawSky(t) {
  if (!skyGrad) return;
  sctx.fillStyle = skyGrad;
  sctx.fillRect(0, 0, W, H);

  // milky way band
  const band = sctx.createLinearGradient(0, H, W, H * 0.1);
  band.addColorStop(0, 'rgba(70,120,190,0)');
  band.addColorStop(0.45, 'rgba(90,150,220,0.055)');
  band.addColorStop(0.55, 'rgba(120,175,240,0.07)');
  band.addColorStop(1, 'rgba(70,120,190,0)');
  sctx.fillStyle = band;
  sctx.fillRect(0, 0, W, H);

  if (galaxyPhoto && galaxyPhoto.complete && galaxyPhoto.naturalWidth && new URLSearchParams(location.search).get('demo') === 'galaxy') {
    sctx.save();
    sctx.globalCompositeOperation = 'screen';
    sctx.globalAlpha = 0.62;
    const size = Math.min(W * 0.82, H * 1.15);
    sctx.drawImage(galaxyPhoto, (W - size) / 2, (H - size) / 2, size, size);
    sctx.restore();
  }

  if (galaxyLayer) {
    sctx.save();
    sctx.globalCompositeOperation = 'screen';
    sctx.globalAlpha = 0.9;
    sctx.drawImage(galaxyLayer, W * 0.05, H * 0.05, W * 0.9, H * 0.9);
    sctx.restore();
  }

  if (clouds) {
    sctx.save();
    sctx.globalCompositeOperation = 'screen';
    sctx.globalAlpha = 0.55;
    sctx.drawImage(clouds, 0, 0, W, H);
    sctx.restore();
  }

  // 银河核心的暖光
  const core = sctx.createRadialGradient(W * 0.52, H * 0.44, 0, W * 0.52, H * 0.44, W * 0.55);
  core.addColorStop(0, 'rgba(255,215,180,0.045)');
  core.addColorStop(0.35, 'rgba(190,150,220,0.06)');
  core.addColorStop(1, 'rgba(80,90,180,0)');
  sctx.fillStyle = core;
  sctx.fillRect(0, 0, W, H);

  for (const s of bandStars) {
    sctx.globalAlpha = s.a;
    sctx.fillStyle = '#bcd8ff';
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fill();
  }

  for (const s of stars) {
    sctx.globalAlpha = Math.max(0.05, s.a * (0.7 + 0.3 * Math.sin(t * s.sp + s.ph)));
    sctx.fillStyle = 'rgb(' + s.c + ')';
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;

  sctx.globalAlpha = 1;
}

          const pairKey = [sourceId, targetId].sort().join('\u0000');
          if (!localMemoryPairs.has(pairKey)) {
            localMemoryPairs.add(pairKey);
            graphData.links.push({
              source: sourceId,
              target: targetId,
              color: realSource.color || '#91a9d4',
              kind: 'memoryAssociation',
              region: realSource.region,
              label: link.label || kind,
            });
          }
        } else if (realSource.region !== 0 && realTarget.region !== 0) {
          const regions = [realSource.region, realTarget.region].sort((a, b) => a - b);
          const pairKey = regions.join(':');
          let pair = corePairs.get(pairKey);
          if (!pair) {
            pair = { sourceRegion: regions[0], targetRegion: regions[1], count: 0 };
            corePairs.set(pairKey, pair);
          }
          pair.count += 1;
        }

        if (!realSource.core && !realTarget.core) {
          realSource.degree += 1; realTarget.degree += 1;
          actualLinks.push({ source: realSource, target: realTarget, kind, label: link.label || '' });
        }
      }
      for (const pair of corePairs.values()) {
        const sourceCore = coreByRegion.get(pair.sourceRegion);
        const targetCore = coreByRegion.get(pair.targetRegion);
        if (!sourceCore || !targetCore) continue;
        graphData.links.push({
          source: sourceCore.id,
          target: targetCore.id,
          color: '#e8ddff',
          kind: 'coreAssociation',
          relationCount: pair.count,
          label: `${pair.count} 条分区关联`,
          visible: true,
        });
      }

      allLayers = [...new Set(actualNodes.map((node) => node.layer))].sort((a, b) => layerName(a).localeCompare(layerName(b), 'zh-CN'));
      if (!activeLayers.size) {
        const requestedLayers = resetFilters ? null : new URLSearchParams(location.search).get('layers')?.split(',').filter(Boolean);
        for (const layer of allLayers) if (!requestedLayers || requestedLayers.includes(layer)) activeLayers.add(layer);
      }
      else for (const layer of [...activeLayers]) if (!allLayers.includes(layer)) activeLayers.delete(layer);
      if (currentBrain === 'group') selectedGroup = groupId || selectedGroup;
      renderLayers();
      renderTierGuide();
      renderStats(data.stats || {});
      renderIndex();
      updateCounts();

      // Resolve endpoints explicitly before passing them to d3-force. This keeps the
      // simulation from treating a branch core id such as "core:1" as a node object.
      for (const link of graphData.links) {
        const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
        const targetId = typeof link.target === 'object' ? link.target.id : link.target;
        link.source = nodeById.get(sourceId);
        link.target = nodeById.get(targetId);
      }
      graphData.links = graphData.links.filter((link) => link.source && link.target);
      graphLoaded = true;

      if (!graphData.nodes.length) {
        note.textContent = '已连接真实记忆数据 · 当前还没有记忆';
      }
      syncGraphData();
      applyVisibility();
      updateHud();
      setTimeout(() => { addGlow(); if (!wasLoaded || !userMovedCamera) fitView(); }, 500);
      const requestedId = new URLSearchParams(location.search).get('node');
      const aliasMatches = actualNodes.filter((node) => node.aliases?.includes(requestedId));
      const requestedNode = actualNodes.find((node) => node.sourceId === requestedId) || (aliasMatches.length === 1 ? aliasMatches[0] : null);
      if (requestedNode) setTimeout(() => showNode(requestedNode, true), 700);
    }

    async function loadLiveGraph({ resetFilters = false } = {}) {
      const requestId = ++graphRequestId;
      const requestedBrain = currentBrain;
      const requestedGroup = selectedGroup;
      const requestParams = new URLSearchParams(location.search);
      requestParams.delete('demo');
      requestParams.delete('v');
      if (requestedBrain === 'group' && requestedGroup) requestParams.set('groupId', requestedGroup);
      else requestParams.delete('groupId');
      const queryString = requestParams.toString();
      const url = '/love-companion/api/graph' + (queryString ? '?' + queryString : '');
      note.textContent = '正在读取真实记忆…';
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!Array.isArray(data.nodes) || !Array.isArray(data.links)) throw new Error('记忆数据格式无效');
        if (requestId !== graphRequestId || requestedBrain !== currentBrain || (requestedBrain === 'group' && requestedGroup !== selectedGroup)) return false;
        buildLiveGraph(data, { resetFilters, groupId: requestedGroup });
        loading.classList.add('hide');
        if (data.version) sourceVersion = data.version;
        loadedBrain = requestedBrain;
        loadedGroup = requestedGroup;
        syncURL();
        return true;
      } catch (error) {
        if (requestId !== graphRequestId) return false;
        note.textContent = '读取失败：' + (error?.message || '本地记忆服务暂不可用');
        if (graphLoaded) {
          currentBrain = loadedBrain;
          selectedGroup = loadedGroup;
          document.getElementById('brain-private').setAttribute('aria-pressed', String(currentBrain === 'private'));
          document.getElementById('brain-group').setAttribute('aria-pressed', String(currentBrain === 'group'));
          const select = document.getElementById('brain-group-select');
          select.hidden = currentBrain !== 'group';
          if (loadedGroup) select.value = loadedGroup;
          loading.classList.add('hide');
          notify('切换失败，已保留当前星图：' + (error?.message || '本地记忆服务暂不可用'));
        } else {
          loading.classList.remove('hide');
          loading.replaceChildren(document.createTextNode('读取记忆失败。请检查本地服务后重试。'));
        }
        return false;
      }
    }

    function layerName(layer) {
      return layerDetails[layer]?.[0] || layer || '其他';
    }

    function layerColor(layer) {
      return layerDetails[layer]?.[1] || COLORS[layer] || '#9bb3ff';
    }

    function matchesQuery(node) {
      if (!query.trim()) return true;
      const haystack = [node.label, node.title, node.content, node.project, node.subcategory,
        ...(Array.isArray(node.keywords) ? node.keywords : [node.keywords || ''])].join(' ').toLocaleLowerCase();
      return haystack.includes(query.trim().toLocaleLowerCase());
    }

    function renderLayers() {
      const target = document.getElementById('layers');
      target.replaceChildren();
      for (const layer of allLayers) {
        const row = document.createElement('label');
        row.className = 'layer' + (activeLayers.has(layer) ? '' : ' off');
        row.style.setProperty('--layer', layerColor(layer));
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = activeLayers.has(layer);
        input.setAttribute('aria-label', '显示图层：' + layerName(layer));
        input.addEventListener('change', () => {
          input.checked ? activeLayers.add(layer) : activeLayers.delete(layer);
          row.classList.toggle('off', !input.checked);
          applyVisibility();
          syncURL();
        });
        const dot = document.createElement('i'); dot.className = 'layer-dot';
        const name = document.createElement('span'); name.textContent = layerName(layer);
        const count = document.createElement('span'); count.className = 'layer-count';
        count.textContent = String(actualNodes.filter((node) => node.layer === layer).length);
        const check = document.createElement('i'); check.className = 'layer-check';
        row.append(input, dot, name, count, check);
        target.append(row);
      }
      document.getElementById('toggle-layers').textContent = allLayers.every((layer) => activeLayers.has(layer)) ? '取消全选' : '全部显示';
    }

    function renderTierGuide() {
      const guide = document.getElementById('tier-guide');
      guide.replaceChildren();
      for (const [label, color, size] of [['核心', '#ffd9a8', 10], ['重要记忆', '#7bdcff', 7], ['普通记忆', '#b5a2ff', 4]]) {
        const item = document.createElement('span');
        const dot = document.createElement('i');
        dot.style.cssText = `width:${size}px;height:${size}px;background:${color};box-shadow:0 0 9px ${color}`;
        item.append(dot, document.createTextNode(label));
        guide.append(item);
      }
    }

    function renderStats(stats = {}) {
      const target = document.getElementById('stats');
      const visible = actualNodes.filter((node) => node._visible);
      const values = [
        [visible.length, '可见记忆'],
        [allLayers.length, '记忆图层'],
        [actualLinks.filter((link) => link.source._visible && link.target._visible).length, '记忆关联'],
      ];
      target.replaceChildren();
      for (const [value, label] of values) {
        const item = document.createElement('div');
        const number = document.createElement('b'); number.textContent = new Intl.NumberFormat('zh-CN').format(value);
        const caption = document.createElement('span'); caption.textContent = label;
        item.append(number, caption); target.append(item);
      }
      document.getElementById('index-title').hidden = false;
      document.getElementById('index-title').textContent = stats.truncated ? `探索记忆 · 已省略 ${stats.truncated} 条` : '探索记忆';
    }

    function updateCounts() {
      renderStats();
      updateHud();
    }

    function applyVisibility() {
      for (const node of actualNodes) {
        node._visible = activeLayers.has(node.layer) && matchesQuery(node);
        node.visible = node._visible;
      }
      for (const core of graphData.nodes.filter((node) => node.core)) {
        core.visible = core.region === 0 || actualNodes.some((node) => node.region === core.region && node._visible);
      }
      for (const link of graphData.links) {
        const source = typeof link.source === 'object' ? link.source : graphData.nodes.find((node) => node.id === link.source);
        const target = typeof link.target === 'object' ? link.target : graphData.nodes.find((node) => node.id === link.target);
        link.visible = Boolean(source?.visible && target?.visible);
      }
      if (selectedNode && !selectedNode._visible) closeNode();
      if (Graph && graphLoaded) Graph.refresh();
      updateLabels();
      renderIndex();
      updateCounts();
      document.getElementById('stage-empty').hidden = actualNodes.some((node) => node._visible) || currentView !== 'graph';
    }

    function sortedVisibleNodes() {
      return actualNodes.filter((node) => node._visible).sort((a, b) => {
        if (sortMode === 'name') return a.label.localeCompare(b.label, 'zh-CN');
        if (sortMode === 'importance') return (b.importance || 0) - (a.importance || 0) || b.degree - a.degree;
        return b.degree - a.degree || (b.importance || 0) - (a.importance || 0);
      });
    }

    function makeMemoryRow(node, detailed = false, relationship = '') {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'node-row';
      button.style.setProperty('--layer', layerColor(node.layer));
      const dot = document.createElement('i'); dot.className = 'layer-dot';
      const copy = document.createElement('span'); copy.className = 'node-copy';
      const title = document.createElement('strong'); title.textContent = node.label || '无标题记忆';
      const meta = document.createElement('small');
      meta.textContent = `${layerName(node.layer)} · ${relationship || node.degree + ' 条关联'}`;
      copy.append(title, meta);
      if (detailed) {
        const excerpt = document.createElement('span'); excerpt.className = 'node-excerpt';
        excerpt.textContent = node.content || '这段记忆暂无正文。'; copy.append(excerpt);
      }
      button.append(dot, copy);
      button.addEventListener('click', () => showNode(node, true));
      return button;
    }

    function renderSearchResults() {
      const card = document.getElementById('search-results');
      card.replaceChildren();
      if (!query.trim()) { card.hidden = true; return; }
      const matches = actualNodes.filter((node) => matchesQuery(node)).slice(0, 8);
      if (!matches.length) {
        const empty = document.createElement('p'); empty.textContent = '没有匹配的记忆'; card.append(empty);
      } else {
        for (const node of matches) {
          const button = document.createElement('button'); button.type = 'button';
          const title = document.createElement('span'); title.textContent = node.label;
          const meta = document.createElement('small'); meta.textContent = layerName(node.layer) + ' · ' + node.degree + ' 条关联';
          button.append(title, meta);
          button.addEventListener('click', () => {
            activeLayers.add(node.layer); query = ''; document.getElementById('q').value = '';
            document.getElementById('search-results').hidden = true;
            applyVisibility(); showNode(node, true);
          });
          card.append(button);
        }
      }
      card.hidden = false;
    }

    function renderIndex() {
      renderSearchResults();
      const visible = sortedVisibleNodes();
      const title = document.getElementById('index-title');
      title.textContent = query.trim() ? `搜索结果 (${visible.length})` : '探索记忆';
      const count = Math.max(0, Number(document.getElementById('index-list').dataset.pageSize || 60));
      for (const [id, detailed] of [['index-list', false], ['memory-list', true]]) {
        const target = document.getElementById(id); target.replaceChildren();
        const fragment = document.createDocumentFragment();
        for (const node of visible.slice(0, count)) fragment.append(makeMemoryRow(node, detailed));
        if (visible.length > count) {
          const more = document.createElement('button'); more.className = 'detail-back';
          more.textContent = `加载更多 (${visible.length - count})`;
          more.addEventListener('click', () => { document.getElementById('index-list').dataset.pageSize = String(count + 60); renderIndex(); });
          fragment.append(more);
        }
        target.append(fragment);
        if (!visible.length) target.innerHTML = '<div class="empty">没有找到相关记忆<small>调整搜索词或重新选择图层。</small></div>';
      }
    }

    function setPanelState(open) {
      document.getElementById('inspector').classList.toggle('has-selection', open);
      panel.classList.toggle('show', open);
      document.getElementById('close').hidden = !open;
      document.getElementById('index-caption').hidden = open;
      document.getElementById('inspector-title').textContent = open ? '记忆详情' : '星海概览';
    }

    function syncURL() {
      const state = new URLSearchParams(location.search);
      for (const key of ['q', 'layers', 'view', 'node']) state.delete(key);
      if (query) state.set('q', query);
      if (activeLayers.size !== allLayers.length) state.set('layers', [...activeLayers].join(','));
      if (currentView !== 'graph') state.set('view', currentView);
      if (selectedNode?.sourceId) state.set('node', selectedNode.sourceId);
      if (currentBrain === 'group' && selectedGroup) state.set('groupId', selectedGroup);
      else state.delete('groupId');
      history.replaceState(null, '', location.pathname + (state.size ? '?' + state.toString() : '') + location.hash);
    }

    function notify(message) {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer); toast.textContent = message; toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
    }

    function showNode(node, focus = false) {
      if (!node._visible) {
        activeLayers.add(node.layer); query = ''; document.getElementById('q').value = '';
        renderLayers(); applyVisibility();
      }
      selectedNode = node;
      document.getElementById('tag').textContent = layerName(node.layer) + (node.project ? ' · ' + node.project : '');
      document.getElementById('title').textContent = node.label || '无标题记忆';
      document.getElementById('body').textContent = node.content || '这段记忆暂无正文。';
      const importance = Number(node.importance || 0);
      const importanceLabel = importance >= 4 ? '核心记忆' : importance >= 3 ? '重要记忆' : importance >= 2 ? '普通记忆' : '日常记忆';
      document.getElementById('detail-facts').innerHTML = `<div><span>重要程度</span>${importance}/${node.coreId ? 5 : 4} · ${importanceLabel}</div><div><span>网络位置</span>${node.degree} 条关联</div>`;
      const meta = [node.type && '类型：' + node.type, node.subcategory && '子类：' + node.subcategory,
        node.epistemic && '认知类型：' + ({ reported: '转述', inferred: '理解/推测', experienced: '经历' }[node.epistemic] || node.epistemic),
        node.sources?.length ? '来源依据 ' + (node.sourceCount || node.sources.length) + ' 处：' + node.sources.map(source => source.reference).join('；') : node.source?.reference && '来源：' + node.source.reference,
        node.supersedes?.length && '保留取代历史：' + node.supersedes.length + ' 条',
        node.status && node.status !== 'active' && '状态：' + node.status].filter(Boolean);
      document.getElementById('meta').textContent = meta.join(' · ');
      const keywords = Array.isArray(node.keywords) ? node.keywords : String(node.keywords || '').split(/[，,\s]+/).filter(Boolean);
      const kw = document.getElementById('kw'); kw.replaceChildren();
      for (const word of keywords.slice(0, 20)) { const chip = document.createElement('span'); chip.textContent = word; kw.append(chip); }
      document.getElementById('keyword-section').hidden = !keywords.length;
      const related = document.getElementById('related'); related.replaceChildren();
      const neighbors = actualLinks.filter((link) => link.source === node || link.target === node)
        .map((link) => ({ node: link.source === node ? link.target : link.source, kind: link.kind }))
        .sort((a, b) => b.node.degree - a.node.degree).slice(0, 12);
      document.getElementById('related-title').hidden = !neighbors.length;
      for (const item of neighbors) related.append(makeMemoryRow(item.node, false, item.kind || '相关记忆'));
      setPanelState(true); panel.scrollTop = 0; syncURL(); updateHud();
      if (focus) {
        const camera = Graph.camera(); const target = Graph.controls().target;
        const dx = camera.position.x - target.x, dy = camera.position.y - target.y, dz = camera.position.z - target.z;
        Graph.cameraPosition({ x: node.x + dx, y: node.y + dy, z: node.z + dz }, { x: node.x, y: node.y, z: node.z }, 500);
        userMovedCamera = true;
      }
      if (matchMedia('(max-width: 660px)').matches) document.getElementById('inspector').classList.add('has-selection');
    }

    function showBranch(core, branchNodes) {
      selectedNode = core;
      document.getElementById('tag').textContent = '记忆分支';
      document.getElementById('title').textContent = core.label;
      document.getElementById('body').textContent = `${core.content || ''}\n${branchNodes.length} 条属于「${core.label}」的记忆。${core.formationReason ? '\n形成理由：' + core.formationReason : ''}`;
      document.getElementById('detail-facts').innerHTML = `<div><span>分支记忆</span>${branchNodes.length} 条</div><div><span>图层</span>${layerName(core.layer)}</div>`;
      document.getElementById('meta').textContent = '';
      document.getElementById('keyword-section').hidden = true;
      document.getElementById('related-title').hidden = !branchNodes.length;
      const related = document.getElementById('related'); related.replaceChildren();
      branchNodes.sort((a, b) => b.importance - a.importance || b.degree - a.degree).slice(0, 40).forEach((node) => related.append(makeMemoryRow(node, false)));
      setPanelState(true); panel.scrollTop = 0; syncURL(); updateHud();
    }

    function closeNode() {
      selectedNode = null; setPanelState(false); syncURL(); updateHud();
    }

    function setView(view, sync = true) {
      currentView = view === 'list' ? 'list' : 'graph';
      const stage = document.getElementById('main');
      stage.classList.toggle('list-view', currentView === 'list');
      document.getElementById('memory-list').hidden = currentView !== 'list';
      document.getElementById('view-graph').setAttribute('aria-pressed', String(currentView === 'graph'));
      document.getElementById('view-list').setAttribute('aria-pressed', String(currentView === 'list'));
      if (sync) syncURL();
    }

    function setZoom(distance) {
      const camera = Graph.camera(); const target = Graph.controls().target;
      const dx = camera.position.x - target.x, dy = camera.position.y - target.y, dz = camera.position.z - target.z;
      const current = Math.max(1, Math.hypot(dx, dy, dz));
      const next = Math.max(140, Math.min(3400, distance));
      const scale = next / current;
      Graph.cameraPosition({ x: target.x + dx * scale, y: target.y + dy * scale, z: target.z + dz * scale }, target, 250);
      document.getElementById('zoom-value').textContent = Math.round(homeDistance / next * 100) + '%';
      userMovedCamera = true;
    }

    function resetView(announce = true) {
      userMovedCamera = false;
      fitView();
      if (announce) notify('已复位星图视角');
    }

    function setMotion(enabled) {
      motionEnabled = enabled;
      document.body.classList.toggle('motion-paused', !enabled);
      for (const id of ['motion', 'motion-main']) {
        const button = document.getElementById(id);
        const label = enabled ? '暂停动画' : '继续动画';
        button.setAttribute('aria-pressed', String(!enabled));
        button.setAttribute('aria-label', label);
        button.title = label;
        button.querySelector('span').textContent = label;
        button.querySelector('use').setAttribute('href', enabled ? '#i-pause' : '#i-play');
      }
    }

    async function loadGroups() {
      const select = document.getElementById('brain-group-select');
      try {
        const response = await fetch('/love-companion/api/groups', { cache: 'no-store' });
        const data = await response.json();
        if (!data.ok || !Array.isArray(data.items)) return;
        select.replaceChildren();
        for (const group of data.items) {
          const option = document.createElement('option'); option.value = String(group.id);
          option.textContent = `群 ${group.id}（${group.members} 人）`; select.append(option);
        }
        if (selectedGroup) select.value = selectedGroup;
        selectedGroup = select.value || '';
        select.hidden = currentBrain !== 'group';
      } catch { /* 群列表不可用时保留私聊图谱 */ }
    }

    function switchBrain(next) {
      const select = document.getElementById('brain-group-select');
      if (next === 'group' && !select.value) { notify('当前没有可显示的群记忆'); return; }
      select.hidden = next !== 'group';
      const changed = next !== currentBrain;
      currentBrain = next;
      document.getElementById('brain-private').setAttribute('aria-pressed', String(next === 'private'));
      document.getElementById('brain-group').setAttribute('aria-pressed', String(next === 'group'));
      if (next === 'group') selectedGroup = select.value;
      userMovedCamera = false;
      loadLiveGraph({ resetFilters: changed });
    }

    async function refreshGraph() {
      const button = document.getElementById('refresh');
      if (button.disabled) return;
      button.disabled = true; button.querySelector('span').textContent = '正在读取…';
      const loaded = await loadLiveGraph();
      button.disabled = false; button.querySelector('span').textContent = '刷新记忆';
      button.classList.remove('has-update');
      notify(loaded ? '记忆已刷新' : '读取失败，请检查本地服务后重试');
    }

    async function checkUpdates() {
      if (document.hidden) return;
      try {
        const response = await fetch('/love-companion/api/graph/status', { cache: 'no-store' });
        const status = await response.json();
        if (!status.ok || !status.version) return;
        if (sourceVersion == null) sourceVersion = status.version;
        else if (status.stale || status.version !== sourceVersion) {
          const button = document.getElementById('refresh'); button.classList.add('has-update');
          if (motionEnabled && !selectedNode && !document.body.classList.contains('sidebar-open')) await loadLiveGraph();
        }
      } catch { /* 更新提示不影响已加载的图谱 */ }
    }

    function bindWorkspace() {
      document.getElementById('q').value = query;
      document.getElementById('brain-private').setAttribute('aria-pressed', String(currentBrain === 'private'));
      document.getElementById('brain-group').setAttribute('aria-pressed', String(currentBrain === 'group'));
      document.getElementById('brain-group-select').hidden = currentBrain !== 'group';
      document.getElementById('q').addEventListener('input', (event) => {
        query = event.target.value; applyVisibility(); syncURL();
      });
      document.getElementById('q').addEventListener('keydown', (event) => { if (event.key === 'Escape') { query = ''; event.target.value = ''; applyVisibility(); syncURL(); } });
      document.getElementById('refresh').addEventListener('click', refreshGraph);
      document.getElementById('toggle-layers').addEventListener('click', () => {
        if (allLayers.every((layer) => activeLayers.has(layer))) activeLayers.clear();
        else for (const layer of allLayers) activeLayers.add(layer);
        renderLayers(); applyVisibility(); syncURL();
      });
      document.getElementById('view-graph').addEventListener('click', () => setView('graph'));
      document.getElementById('view-list').addEventListener('click', () => setView('list'));
      document.getElementById('sort').addEventListener('change', (event) => { sortMode = event.target.value; renderIndex(); });
      document.getElementById('brain-private').addEventListener('click', () => switchBrain('private'));
      document.getElementById('brain-group').addEventListener('click', () => switchBrain('group'));
      document.getElementById('brain-group-select').addEventListener('change', (event) => {
        selectedGroup = event.target.value; userMovedCamera = false;
        if (currentBrain === 'group') {
          loadLiveGraph({ resetFilters: true });
        }
      });
      document.getElementById('zoom-in').addEventListener('click', () => setZoom(Graph.controls().target.distanceTo(Graph.camera().position) / 1.18));
      document.getElementById('zoom-out').addEventListener('click', () => setZoom(Graph.controls().target.distanceTo(Graph.camera().position) * 1.18));
      document.getElementById('reset-view').addEventListener('click', () => resetView());
      document.getElementById('motion').addEventListener('click', () => setMotion(!motionEnabled));
      document.getElementById('motion-main').addEventListener('click', () => setMotion(!motionEnabled));
      document.getElementById('close').addEventListener('click', closeNode);
      document.getElementById('back-to-index').addEventListener('click', closeNode);
      document.getElementById('menu').addEventListener('click', () => setSidebar(!document.body.classList.contains('sidebar-open')));
      document.getElementById('dismiss-menu').addEventListener('click', () => setSidebar(false));
      document.addEventListener('pointerdown', (event) => {
        if (document.body.classList.contains('sidebar-open') && !event.target.closest('#sidebar, #menu')) setSidebar(false);
      });
      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); document.getElementById('q').focus(); }
        if (event.key === 'Escape') { if (selectedNode) closeNode(); else if (query) { query = ''; document.getElementById('q').value = ''; applyVisibility(); syncURL(); } }
      });
      window.addEventListener('resize', () => { setSidebar(document.body.classList.contains('sidebar-open')); buildSky(); drawSky(0); Graph.width(document.getElementById('scene').clientWidth).height(document.getElementById('scene').clientHeight); updateLabels(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdates(); });
      document.getElementById('brain-group-select').value = selectedGroup;
      setSidebar(false); setMotion(motionEnabled); setView(urlState.get('view'), false);
    }

    function setSidebar(open) {
      document.body.classList.toggle('sidebar-open', open);
      document.getElementById('menu').setAttribute('aria-expanded', String(open));
      document.getElementById('menu').setAttribute('aria-label', open ? '关闭功能面板' : '打开功能面板');
      document.getElementById('sidebar').inert = matchMedia('(max-width: 960px)').matches && !open;
    }

    function hashPhase(value) {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i += 1) hash = Math.imul(hash ^ value.charCodeAt(i), 16777619);
      hash = Math.imul(hash ^ (hash >>> 16), 0x85ebca6b);
      hash = Math.imul(hash ^ (hash >>> 13), 0xc2b2ae35);
      hash ^= hash >>> 16;
      return (hash >>> 0) / 4294967295 * Math.PI * 2;
    }

    function randomDirection3D() {
      const y = Math.random() * 2 - 1;
      const angle = Math.random() * Math.PI * 2;
      const planar = Math.sqrt(1 - y * y);
      return { x: planar * Math.cos(angle), y, z: planar * Math.sin(angle) };
    }

    function branchDirection3D(slot, branchKey) {
      // Golden-angle samples cover the whole sphere as memories arrive, instead of
      // allowing a short random sample to collapse into one fan-shaped hemisphere.
      const fraction = ((slot + 0.5) * 0.7548776662466927) % 1;
      const y = 1 - 2 * fraction;
      const planar = Math.sqrt(Math.max(0, 1 - y * y));
      const phase = hashPhase(String(branchKey));
      const angle = slot * 2.399963229728653 + phase;
      const x0 = planar * Math.cos(angle);
      const z0 = planar * Math.sin(angle);
      const tilt = Math.sin(phase * 1.71) * 0.72;
      const yaw = hashPhase(String(branchKey) + ':yaw');
      const y1 = y * Math.cos(tilt) - z0 * Math.sin(tilt);
      const z1 = y * Math.sin(tilt) + z0 * Math.cos(tilt);
      const jitter = () => (Math.random() - 0.5) * 0.16;
      const x = x0 * Math.cos(yaw) + z1 * Math.sin(yaw) + jitter();
      const yy = y1 + jitter();
      const z = -x0 * Math.sin(yaw) + z1 * Math.cos(yaw) + jitter();
      const length = Math.hypot(x, yy, z) || 1;
      return { x: x / length, y: yy / length, z: z / length };
    }

    const branchPulls = new Map();

    function moveWithDamping(node, x, y, z, dt) {
      // Velocity belongs to our small spring solver, independently of d3's layout.
      const state = node.__elastic ??= { x: 0, y: 0, z: 0 };
      const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
      const step = dt / steps;
      const drag = Math.exp(-5.5 * step);
      const stiffness = node.core ? 15 : 18;
      for (let i = 0; i < steps; i += 1) {
        state.x = (state.x + (x - node.x) * stiffness * step) * drag;
        state.y = (state.y + (y - node.y) * stiffness * step) * drag;
        state.z = (state.z + (z - node.z) * stiffness * step) * drag;
        node.x += state.x * step;
        node.y += state.y * step;
        node.z += state.z * step;
      }
      node.fx = node.x; node.fy = node.y; node.fz = node.z;
      node.vx = 0; node.vy = 0; node.vz = 0;
    }

    function startElasticDrag(node) {
      node.__manualDragging = true;
      branchPulls.set(node.region, node);
    }

    function endElasticDrag(node) {
      node.__manualDragging = false;
      if (branchPulls.get(node.region) === node) branchPulls.delete(node.region);
      // Keep the original home/ambient anchor: release must return, never rebase.
      node.fx = node.x; node.fy = node.y; node.fz = node.z;
    }

    // Breathing supplies moving targets; springs give the stars lag and recovery.
    function updateBranchStar(node, core, seconds, dt) {
      if (node.__manualDragging) return;
      if (node.core) {
        const home = node.__homePosition;
        if (home) moveWithDamping(node, home.x, home.y, home.z, dt);
        return;
      }
      const base = node.__ambientBase;
      if (!base || !core) return;
      base.cx ??= core.x; base.cy ??= core.y; base.cz ??= core.z;
      const dx = base.x - base.cx, dy = base.y - base.cy, dz = base.z - base.cz;
      const radius = Math.hypot(dx, dy, dz) || 1;
      const phase = base.phase;
      const branchPhase = core.__breathPhase ??= hashPhase('breath:' + core.id);
      const breath = Math.sin(seconds * Math.PI * 2 / 8.5 + branchPhase);
      const wave = Math.sin(seconds * 0.64 + phase + radius * 0.012);
      const stretch = 1 + breath * 0.36 + wave * 0.055;
      const amplitude = node.isSelfStar ? 17 : 22;
      // Different smooth local waves flex the connecting strands without jitter.
      const wx = Math.sin(seconds * 0.57 + phase) * amplitude;
      const wy = Math.sin(seconds * 0.43 + phase * 1.41) * amplitude;
      const wz = Math.cos(seconds * 0.51 + phase * 0.77) * amplitude;
      const radial = (wx * dx + wy * dy + wz * dz) / (radius * radius);
      const target = node.__motionTarget ??= { x: 0, y: 0, z: 0 };
      target.x = core.x + dx * stretch + wx - dx * radial;
      target.y = core.y + dy * stretch + wy - dy * radial;
      target.z = core.z + dz * stretch + wz - dz * radial;
      let pullX = 0, pullY = 0, pullZ = 0;
      const pulled = branchPulls.get(node.region);
      if (pulled && !pulled.core && pulled.__motionTarget && pulled.__ambientBase) {
        const rest = pulled.__ambientBase;
        const distance = Math.hypot(base.x - rest.x, base.y - rest.y, base.z - rest.z);
        const weight = 0.35 * Math.exp(-distance / 180);
        pullX = (pulled.x - pulled.__motionTarget.x) * weight;
        pullY = (pulled.y - pulled.__motionTarget.y) * weight;
        pullZ = (pulled.z - pulled.__motionTarget.z) * weight;
      }
      moveWithDamping(node, target.x + pullX, target.y + pullY, target.z + pullZ, dt);
      node.__breathScale = 1 + breath * 0.30 + wave * 0.035;
    }

    let motionSeconds = 0;
    // Straight links and travelling particles, batched into two draw calls.
    function createBatchedFlow(Graph, getData) {
      const lineGeometry = new THREE.BufferGeometry();
      const particleGeometry = new THREE.BufferGeometry();
      const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.66, depthWrite: false });
      const dot = document.createElement('canvas'); dot.width = dot.height = 32;
      const context = dot.getContext('2d');
      const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
      gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.25, '#ffffff');
      gradient.addColorStop(0.5, '#ffffff99'); gradient.addColorStop(1, '#ffffff00');
      context.fillStyle = gradient; context.fillRect(0, 0, 32, 32);
      const texture = new THREE.CanvasTexture(dot);
      const particleMaterial = new THREE.PointsMaterial({ map: texture, color: '#c5f9ff', size: 6, sizeAttenuation: false, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
      const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
      const particles = new THREE.Points(particleGeometry, particleMaterial);
      lines.frustumCulled = particles.frustumCulled = false;
      lines.raycast = particles.raycast = () => {};
      Graph.scene().add(lines, particles);
      let lastLinks, lastCount = -1;
      let positions, colors, photons;
      const scratchColor = new THREE.Color();
      const colorCache = new Map();
      function update(seconds) {
        const data = getData();
        if (lastLinks !== data.links || lastCount !== data.links.length) {
          lastLinks = data.links; lastCount = data.links.length;
          lineGeometry.dispose(); particleGeometry.dispose();
          positions = new Float32Array(lastCount * 6);
          colors = new Float32Array(lastCount * 6);
          photons = new Float32Array(lastCount * 6);
          lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
          lineGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage));
          particleGeometry.setAttribute('position', new THREE.BufferAttribute(photons, 3).setUsage(THREE.DynamicDrawUsage));
        }
        let lineCount = 0, particleCount = 0;
        for (let index = 0; index < data.links.length; index += 1) {
          const link = data.links[index];
          const source = link.source, target = link.target;
          if (link.visible === false || !source || !target || source.visible === false || target.visible === false || !Number.isFinite(source.x) || !Number.isFinite(target.x)) continue;
          const offset = lineCount * 6;
          positions[offset] = source.x; positions[offset + 1] = source.y; positions[offset + 2] = source.z;
          positions[offset + 3] = target.x; positions[offset + 4] = target.y; positions[offset + 5] = target.z;
          const key = link.color || '#91b6d6';
          let color = colorCache.get(key);
          if (!color) { scratchColor.set(key); color = [scratchColor.r, scratchColor.g, scratchColor.b]; colorCache.set(key, color); }
          const coreLink = link.kind === 'coreBridge' || link.kind === 'coreAssociation';
          const brightness = (coreLink ? 1 : 0.72) * (1 + (link.__hoverLevel || 0));
          for (let end = 0; end < 2; end += 1) {
            for (let axis = 0; axis < 3; axis += 1) colors[offset + end * 3 + axis] = Math.min(1, color[axis] * brightness);
          }
          lineCount += 1;
          const count = coreLink ? 2 : 1;
          for (let particle = 0; particle < count; particle += 1) {
            const progress = (seconds / 9 + index * 0.61803398875 + particle / count) % 1;
            const at = particleCount++ * 3;
            photons[at] = source.x + (target.x - source.x) * progress;
            photons[at + 1] = source.y + (target.y - source.y) * progress;
            photons[at + 2] = source.z + (target.z - source.z) * progress;
          }
        }
        lineGeometry.setDrawRange(0, lineCount * 2);
        particleGeometry.setDrawRange(0, particleCount);
        lineGeometry.attributes.position.needsUpdate = true;
        lineGeometry.attributes.color.needsUpdate = true;
        particleGeometry.attributes.position.needsUpdate = true;
      }
      return { update };
    }


    function syncGraphData() {
      if (!Graph) return;
      const nodesById = new Map(graphData.nodes.map((node) => [node.id, node]));
      for (const link of graphData.links) {
        if (typeof link.source !== 'object') link.source = nodesById.get(link.source);
        if (typeof link.target !== 'object') link.target = nodesById.get(link.target);
      }
      // A fresh object and fresh arrays are required for ForceGraph's change detection.
      Graph.graphData({ nodes: graphData.nodes.slice(), links: graphData.links.slice() });
    }

    function ensureCore(index, refresh = true) {
      if (coreByRegion.has(index)) return coreByRegion.get(index);
      const core = newCore(index);
      connectDemoCores(index);
      if (refresh && Graph) syncGraphData();
      updateHud();
      return core;
    }

    function addMemory(index, tag, sequence) {
      const core = ensureCore(index, false);
      const data = regionData.get(index);
      const siblings = data.nodes;
      const direction = branchDirection3D(siblings.length, regions[index].name);
      const radius = index === 0 ? 96 + Math.random() * 62 : 145 + Math.random() * 70;
      const x = core.x + direction.x * radius;
      const y = core.y + direction.y * radius;
      const z = core.z + direction.z * radius;
      const node = { id: 'm:' + memorySequence++, label: regions[index].name + ' · ' + tag, color: regions[index].color,
        size: index === 0 ? 6.2 : 1.4 + Math.random() * 1.8, region: index, isSelfStar: index === 0, tags: [tag, regions[index].name], sequence, visible: true,
        x, y, z, fx: x, fy: y, fz: z };
      node.__ambientBase = { x: node.x, y: node.y, z: node.z, phase: hashPhase(node.id), cx: core.x, cy: core.y, cz: core.z };
      const link = { source: core.id, target: node.id, color: regions[index].color, kind: 'branchMemory', region: index, visible: true };
      graphData.nodes.push(node); graphData.links.push(link); siblings.push(node);
      data.links.push(link); data.tagCounts.set(tag, (data.tagCounts.get(tag) || 0) + 1);
      // Keep related stars woven inside their own partition. Cross-partition stars
      // are never linked directly; those relations are represented by core links.
      const relatedStar = siblings.slice(0, -1).filter((item) => item.tags[0] === tag).at(-1)
        || siblings.at(-2);
      if (relatedStar) {
        const starLink = { source: relatedStar.id, target: node.id, color: regions[index].color, kind: 'memoryAssociation', region: index, visible: true };
        graphData.links.push(starLink); data.links.push(starLink);
      }
      updateHud();
    }

    // Replaceable ingestion boundary for real journal/life/learning/network events.
    function ingestMemories(items) {
      for (const item of items) addMemory(item.region, item.tag, item.sequence ?? memorySequence);
      if (Graph && items.length) {
        syncGraphData();
        setTimeout(addGlow, 350);
      }
    }

    function updateLabels() {
      const selfCore = coreByRegion.get(0);
      const center = selfCore ? Graph.graph2ScreenCoords(selfCore.x, selfCore.y, selfCore.z) : null;
      for (const { el, core } of labels) {
        if (!Number.isFinite(core.x)) continue;
        if (core.visible === false) { el.style.display = 'none'; continue; }
        const pos = Graph.graph2ScreenCoords(core.x, core.y, core.z);
        // Keep every core name present; cores behind the camera are dimmed rather than hidden.
        el.style.display = '';
        el.style.opacity = pos.z > 1 ? '0.48' : '1';
        // Place labels just outside each core. Radial offsets separate nearby labels and
        // are recomputed from the live projection without frame-to-frame collision shuffling.
        let dx = 0, dy = core.region === 0 ? 50 : 46;
        if (core.region !== 0 && center) {
          const angle = Math.atan2(pos.y - center.y, pos.x - center.x) + (core.region % 2 ? 0.14 : -0.14);
          dx = Math.cos(angle) * 46;
          dy = Math.sin(angle) * 46;
        }
        el.style.left = (pos.x + dx) + 'px';
        el.style.top = (pos.y + dy) + 'px';
      }
    }

    if (demo === 'brain') {
    for (let i = 0; i < regions.length; i += 1) if (regions[i].initial) newCore(i);
    }
    updateHud();

    Graph = ForceGraph3D()(document.getElementById('scene'))
      .backgroundColor('rgba(2, 4, 10, 0)')
      .graphData(graphData)
      .nodeId('id')
      .nodeLabel((node) => node.label || node.id)
      .nodeColor((node) => node === selectedNode ? '#ffffff' : node.color || '#b5a2ff')
      .nodeVal((node) => node.size || 2)
      .nodeRelSize(2.7)
      .nodeResolution(12)
      .nodeOpacity(0.96)
      .nodeVisibility((node) => node.visible !== false)
      .linkColor((link) => link.color || '#8fb6ff')
      .linkLabel((link) => link.label || '')
      // ForceGraph accepts a numeric opacity; an accessor makes photon opacity NaN.
      .linkOpacity(0.8)
      .linkWidth(0)
      .linkVisibility(false)
      .linkDirectionalParticles(0)
      .linkCurvature(0)
      .onNodeDrag(startElasticDrag)
      .onNodeDragEnd(endElasticDrag)
      .enableNodeDrag(true);

    Graph.onNodeClick((node) => {
      if (node.core) {
        const branchNodes = actualNodes.filter((item) => item.region === node.region && item._visible);
        showBranch(node, branchNodes);
      } else {
        showNode(node, true);
      }
    });
    const graphEffects = createGraphEffects(() => graphData);
    const batchedFlow = createBatchedFlow(Graph, () => graphData);
    Graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    Graph.onNodeHover((node) => {
      graphEffects.setHover(node);
      Graph.renderer().domElement.style.cursor = node ? 'pointer' : 'grab';
    });

    for (const force of ['charge', 'link', 'center']) Graph.d3Force(force, null);
    Graph.cooldownTicks(Infinity).cooldownTime(Infinity);
    const controls = Graph.controls();
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = false;
    controls.rotateSpeed = 0.9;
    controls.zoomSpeed = 0.95;
    controls.panSpeed = 1.1;
    controls.screenSpacePanning = true;
    controls.minDistance = 140;
    controls.maxDistance = 3400;
    controls.addEventListener('start', () => { userMovedCamera = true; });
    if ('zoomToCursor' in controls) controls.zoomToCursor = true;
    const graphCanvas = Graph.renderer().domElement;
    graphCanvas.addEventListener('mousedown', (event) => { if (event.button === 1) event.preventDefault(); }, true);
    graphCanvas.addEventListener('auxclick', (event) => { if (event.button === 1) event.preventDefault(); }, true);
    graphCanvas.addEventListener('mouseup', (event) => { if (event.button === 1) event.preventDefault(); }, true);

    Graph.cameraPosition({ x: 60, y: 180, z: 720 }, { x: 0, y: 0, z: 0 }, 0);

    const glowObjects = [];
    function addGlow() {
      for (const node of graphData.nodes) {
        const object = node.__threeObj;
        if (!object || object.__glow || !object.material || (!node.core && !node.isSelfStar)) continue;
        try {
          if ((node.core || node.isSelfStar) && object.material.emissive) {
            object.material.emissive.set(node.color);
            object.material.emissiveIntensity = node.core ? 1.05 : 0.84;
          }
          const material = object.material.clone();
          material.transparent = true;
          material.opacity = node.core ? 0.38 : node.isSelfStar ? 0.3 : 0.11;
          material.blending = 2;
          material.depthWrite = false;
          const halo = new object.constructor(object.geometry, material);
          halo.scale.setScalar(node.core ? 3.3 : node.isSelfStar ? 2.6 : 1.7);
          object.add(halo);
          object.__glow = true;
          glowObjects.push({ halo, base: halo.scale.x, phase: Math.random() * Math.PI * 2, core: node.core, selfStar: node.isSelfStar });
        } catch (error) {
          // 自定义节点对象不支持克隆时跳过
        }
      }
    }

    function fitView() {
      const points = graphData.nodes.filter((node) => node.visible !== false && Number.isFinite(node.x));
      if (!points.length) return;
      const root = coreByRegion.get(0);
      const center = root ? { x: root.x, y: root.y, z: root.z } : { x: 0, y: 0, z: 0 };
      let radius = 0;
      for (const node of points) radius = Math.max(radius, Math.hypot(node.x - center.x, node.y - center.y, node.z - center.z));
      const distance = Math.max(1800, radius * 2.35);
      homeDistance = distance;
      document.getElementById('zoom-value').textContent = '100%';
      const vertical = initialCameraOrientation.vertical;
      const horizontal = Math.sqrt(1 - vertical * vertical);
      Graph.cameraPosition({
        x: center.x + Math.cos(initialCameraOrientation.yaw) * distance * horizontal,
        y: center.y + distance * vertical,
        z: center.z + Math.sin(initialCameraOrientation.yaw) * distance * horizontal,
      }, center, 700);
    }

    let previousFrameTime = 0;
    const camera = Graph.camera();
    function frame(time) {
      const dt = Math.min(50, previousFrameTime ? time - previousFrameTime : 16);
      const running = motionEnabled && !document.hidden && currentView === 'graph';
      const previousMotionSeconds = motionSeconds;
      if (running) motionSeconds += dt / 1000;
      controls.update();
      const target = controls.target;
      if (running) {
        const pitch = Math.sin(motionSeconds * 0.3) * 26;
        const previousPitch = Math.sin(previousMotionSeconds * 0.3) * 26;
        camera.position.y += pitch - previousPitch;
        {
          const angle = dt * (0.000009 + 0.000002 * Math.sin(motionSeconds * 0.12));
          const dx = camera.position.x - target.x;
          const dz = camera.position.z - target.z;
          const cosine = Math.cos(angle), sine = Math.sin(angle);
          camera.position.x = target.x + dx * cosine - dz * sine;
          camera.position.z = target.z + dx * sine + dz * cosine;
        }
      }
      if (running) {
        for (const node of graphData.nodes) {
          updateBranchStar(node, coreByRegion.get(node.region), motionSeconds, dt / 1000);
        }
      }
      camera.lookAt(target);
      camera.updateMatrixWorld();
      previousFrameTime = time;
      updateLabels();
      graphEffects.update(time, running);
      if (currentView === 'graph') batchedFlow.update(motionSeconds);
      if (running) for (const item of glowObjects) {
        const amplitude = item.core ? 0.2 : item.selfStar ? 0.16 : 0.08;
        const scale = item.base * (1 + amplitude * Math.sin(motionSeconds * (item.core ? 1.5 : 1.1) + item.phase));
        item.halo.scale.setScalar(scale);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    setTimeout(addGlow, 600);

    buildSky();
    drawSky(0);
    animateSky();
    bindWorkspace();
    loadGroups();

    let initialFitDone = false;
    Graph.onEngineStop(updateLabels);
    // demo injects realistic-sized batches through the same public ingestion boundary.
    if (demo === 'brain') {
      let seq = 0;
      const inject = (index, count) => {
        const batch = [];
        for (let i = 0; i < count; i += 1) {
          const region = regions[index];
          const tag = region.tags[(seq + i * 7 + Math.floor(Math.random() * region.tags.length)) % region.tags.length];
          batch.push({ region: index, tag, sequence: seq++ });
        }
        ingestMemories(batch);
        if (!initialFitDone) { initialFitDone = true; setTimeout(fitView, 600); }
      };
      [0, 1, 2].forEach((index, slot) => setTimeout(() => inject(index, 20), 900 + slot * 170));
      [3, 4, 5, 6].forEach((index, slot) => setTimeout(() => inject(index, regions[index].count), 4200 + slot * 2200));
      [7, 8, 9].forEach((index, slot) => setTimeout(() => inject(index, regions[index].count), 13000 + slot * 2200));
    } else {
      loadLiveGraph();
    }
    setInterval(checkUpdates, 30000);
    window.__graph = Graph;
    window.ingestMemories = ingestMemories;
    window.ensureCore = ensureCore;

}
try { startStarMap(); } catch (error) { showWebGLFallback(error); }
</script>
</body>
